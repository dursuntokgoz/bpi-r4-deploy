name: Build BPI-R4 Pro 8X

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'Pro-8X-wifi'
        type: choice
        options:
          - Pro-8X-wifi
          - Pro-8X-wired
      repo_commit:
        description: 'Commit hash of this repository (leave empty for latest)'
        required: false
        default: ''
      openwrt_commit:
        description: 'OpenWrt commit hash (leave empty to use build-versions.env)'
        required: false
        default: ''
      mtk_commit:
        description: 'MTK SDK commit hash (leave empty to use build-versions.env)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.repo_commit || github.sha }}

      - name: Load build versions
        run: |
          cat build-versions.env >> $GITHUB_ENV
          [ -n "${{ github.event.inputs.openwrt_commit }}" ] && echo "OPENWRT_COMMIT=${{ github.event.inputs.openwrt_commit }}" >> $GITHUB_ENV || true
          [ -n "${{ github.event.inputs.mtk_commit }}" ] && echo "MTK_COMMIT=${{ github.event.inputs.mtk_commit }}" >> $GITHUB_ENV || true

      - name: Set build variables
        run: |
          VARIANT="${{ github.event.inputs.variant }}"

          # Unique per-build timestamp (Europe/Istanbul) — used for archive release tags
          echo "BUILD_TS=$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)" >> $GITHUB_ENV

          if [ "$VARIANT" = "Pro-8X-wifi" ]; then
            echo "BUILDER=./builder-pro-8x.sh" >> $GITHUB_ENV
            echo "RELEASE_TAGS=release-pro-8x-standard" >> $GITHUB_ENV
          else
            echo "BUILDER=./builder-pro-8x-wired.sh" >> $GITHUB_ENV
            echo "RELEASE_TAGS=release-pro-8x-wired" >> $GITHUB_ENV
          fi

      - name: Delete existing releases and tags
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tags = process.env.RELEASE_TAGS.split(' ');

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });

            for (const tag of tags) {
              for (const rel of releases.data) {
                if (rel.tag_name === tag) {
                  await github.rest.repos.deleteRelease({
                    owner,
                    repo,
                    release_id: rel.id
                  }).catch(e => console.log(`Failed to delete release ${rel.id}: ${e.message}`));
                }
              }
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`
              }).catch(e => console.log(`Failed to delete tag ${tag}: ${e.message}`));
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Restore MTK cache
        id: cache-mtk
        uses: actions/cache@v4
        with:
          path: repo-cache/mtk-openwrt-feeds.tar.gz
          key: mtk-${{ env.MTK_COMMIT }}

      - name: Clone and cache MTK feeds
        if: steps.cache-mtk.outputs.cache-hit != 'true'
        run: |
          mkdir -p repo-cache
          # github mirror first (git01.mediatek.com freezes); fall back to git01 if the commit is missing
          if git init mtk-clone \
             && git -C mtk-clone remote add origin https://github.com/mediatek/mtk-openwrt-feeds \
             && git -C mtk-clone fetch --depth=1 origin ${{ env.MTK_COMMIT }} \
             && git -C mtk-clone checkout FETCH_HEAD; then
            echo "MTK feed ${{ env.MTK_COMMIT }} fetched from github mirror"
          else
            rm -rf mtk-clone
            git clone --branch master https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds mtk-clone
            git -C mtk-clone checkout ${{ env.MTK_COMMIT }}
          fi
          tar -czf repo-cache/mtk-openwrt-feeds.tar.gz mtk-clone
          rm -rf mtk-clone

      - name: Run builder script
        run: |
          chmod +x ${{ env.BUILDER }}
          ${{ env.BUILDER }} 2>&1 | tee build_log.txt
          exit ${PIPESTATUS[0]}
        env:
          OPENWRT_COMMIT: ${{ env.OPENWRT_COMMIT }}
          MTK_COMMIT: ${{ env.MTK_COMMIT }}
          MTK_FEED_TARBALL: repo-cache/mtk-openwrt-feeds.tar.gz

      - name: Print Build Failure Details
        if: failure()
        run: |
          echo "### ❌ Build Failed!" >> $GITHUB_STEP_SUMMARY
          echo "Here are the files or packages that caused the failure:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -iE "error: package/.*failed to build|make\[.*\]: \*\*\* .* error [0-9]" build_log.txt | tail -n 20 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Prepare release artifacts
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          FILOGIC="openwrt/bin/targets/mediatek/filogic"

          mkdir -p rel-pro
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-squashfs-sysupgrade.itb" rel-pro/bpi-r4-pro-8x.itb
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-nvme-img.bin"            rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-sdcard.img.gz"           rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-emmc-img.bin"            rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-snand-img.bin"           rel-pro/
          cp "${FILOGIC}/config.buildinfo"                                                          rel-pro/
          cp rescue/bpi-r4-pro-rescue-sdcard.img.gz                                               rel-pro/
          cp rescue/bpi-r4-pro-snand-img.bin                                                      rel-pro/
          cp unifi/unifi-setup.sh                                                                  rel-pro/
          cp unifi/rc.local                                                                        rel-pro/
          cp unifi/rc-network.sh                                                                   rel-pro/
          cp unifi/unifi-network-setup-8gb.sh                                                      rel-pro/unifi-network-setup.sh
          cd rel-pro
          sha256sum bpi-r4-pro-8x.itb \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-nvme-img.bin \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-sdcard.img.gz \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-emmc-img.bin \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-snand-img.bin > sha256sums
          cd ..

      - name: Publish release-pro-8x-standard
        if: github.event.inputs.variant == 'Pro-8X-wifi'
        run: |
          gh release delete release-pro-8x-standard --yes 2>/dev/null || true
          gh release create release-pro-8x-standard rel-pro/* \
            --title "BPI-R4 Pro 8X standard WiFi (latest)" \
            --notes "Variant: standard (WiFi + wifimgr) | RAM: 8GB | BPI-R4 Pro 8X | Commit: ${{ github.event.inputs.repo_commit || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-pro-8x-wired
        if: github.event.inputs.variant == 'Pro-8X-wired'
        run: |
          gh release delete release-pro-8x-wired --yes 2>/dev/null || true
          gh release create release-pro-8x-wired rel-pro/* \
            --title "BPI-R4 Pro 8X wired (latest)" \
            --notes "Variant: wired (no wifimgr) | RAM: 8GB | BPI-R4 Pro 8X | Commit: ${{ github.event.inputs.repo_commit || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Timestamped archive release: every build additionally publishes an
      # immutable "archive-pro-8x-*-<YYYYMMDD-HHMM>" release, so previous
      # builds are never overwritten and can be rolled back to. The fixed
      # "release-pro-8x-*" (latest) tags above stay untouched — install
      # scripts in already-flashed images keep downloading from them.
      - name: Publish timestamped archive release
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          if [ "$VARIANT" = "Pro-8X-wifi" ]; then
            NAME="pro-8x-standard"
          else
            NAME="pro-8x-wired"
          fi
          TAG="archive-${NAME}-${{ env.BUILD_TS }}"
          echo "Publishing archive release: $TAG"
          gh release create "$TAG" rel-pro/* \
            --target "${{ github.sha }}" \
            --title "Archive ${NAME} ${{ env.BUILD_TS }}" \
            --notes "Snapshot of build ${{ env.BUILD_TS }} (Europe/Istanbul) | Variant: $VARIANT | Commit: ${{ github.event.inputs.repo_commit || github.sha }}

          This is an immutable archive of a single build. For the current build always use the matching \`release-pro-8x-*\` (latest) tag."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
